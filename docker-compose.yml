version: '3.8'

services:
  db:
    image: postgres:15
    container_name: geovision_db
    environment:
      POSTGRES_USER: geovision
      POSTGRES_PASSWORD: geovision_password
      POSTGRES_DB: geovision_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
